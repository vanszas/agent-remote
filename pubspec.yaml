name: hermes_remote
description: "App-first Flutter Android client for Hermes Agent."
publish_to: 'none'
version: 0.2.0+1

environment:
  sdk: ^3.12.2

dependencies:
  file_picker: 10.3.10
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12
  image_picker: ^1.2.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config/connection_providers.json
